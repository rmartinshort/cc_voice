[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-observer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "claude-code-sdk>=0.0.25",
    "anthropic>=0.59.0",
    "pydantic>=2.0",
    "anyio>=4.3.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    # Phase 3 deps — included now so the environment is complete:
    "pipecat-ai>=0.0.40",
    "faster-whisper>=1.0.0",
    "pyaudio>=0.2.14",
    "elevenlabs>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff", "mypy"]

[project.scripts]
voice-observer = "voice_observer.main:cli"
voice-observer-hook = "voice_observer.hook_forwarder:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_observer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
